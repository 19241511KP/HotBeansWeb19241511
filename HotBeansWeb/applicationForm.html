<!DOCTYPE html>
<html>
    <head>
        <title>Hot Beans Web | Application Form</title>
        <script src="js/main.js" defer></script>
        <link rel="stylesheet" href="css/style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <script src="js/burger.js" defer></script>
    </head>
    <body class="body">
    
        <header class="header">
            <div class="header_container">
                <img class="logo" src="images/logo.png">
                <h2 class="header_title"><a class="header_list_link" href="aboutUs.html">Hot Beans Web</a></h2> 
                <div class="burger_menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <nav class="header_navigation">
                    <ul class="header_list">
                        <li class="header_list_item"><a class="header_list_link" href="aboutUs.html">About</a></li>
                        <li class="header_list_item"><a class="header_list_link" href="ourTeam.html">Our team</a></li>
                        <li class="header_list_item"><a class="header_list_link" href="vacancies.html">Vacancies</a></li>
                        <li class="header_list_item"><a class="header_list_link" href="training.html">Training</a></li> 
                    </ul>
                </nav>
            </div>
        </header>
        <section class="main">
            <h1 class="applicationFormHeading">Hot Beans Web | Application Form</h1>
            <div style="display: flex; align-items: center; justify-content: center;">
                <form action="#" method="post">
                    <label class="applicationFormLabel">Choose what you are applying for:</label>
                    <div>
                        <select id="learningOptions" class="applicationFormItem" required>
                            <option value="apprenticeship">Apprenticeship</option>
                            <option value="trainingCourse">Training course</option>
                        </select>
                    </div>
                    <label class="applicationFormLabel" id="courseLabel">Choose apprenticeship you want to apply:</label>
                    <div>
                        <select name="courseOptions" id="courseOptions" class="applicationFormItem" required>
                            <option value="frontendSE">Frontend Software Engineer</option>
                            <option value="backendSE">Backend Software Engineer</option>
                            <option value="mobileDev">Mobile Developer</option>
                        </select>
                    </div>
                    <label class="applicationFormLabel">Name</label>
                    <div>
                        <input type="text" placeholder="Name" class="applicationFormItem" required>
                    </div>
                    <label class="applicationFormLabel">Email</label>
                    <label class="applicationFormLabel" style="margin-left: 370px;">Phone</label>
                    <div>
                        <input type="text" placeholder="Email" class="applicationFormItem" required>
                        <input type="tel" placeholder="Phone Number" maxlength="11" class="applicationFormItem" required>
                    </div>
                    <label class="applicationFormLabel">Resume</label>
                    <div>
                        <label id="dropZone">
                            <img src="images/paperclip.png" alt="paperclip.png" style="width: 25px; height: 25px;">
                            Drag your resume here or click to upload
                            <input type="file" id="fileInput">
                        </label>
                        <ul id="preview"></ul>
                        <button id="clearBtn" class="resumeClearBtn">Clear</button>
                    </div>
                    <label class="applicationFormLabel">Are you currently based in UK?</label>
                    <div style="margin-left: 34px; margin-top: 10px; margin-bottom: 25px;" id="choiceGroup">
                        <button class="choiceBtn" id="choiceBtnYes" type="button">Yes</button>
                        <button class="choiceBtn" id="choiceBtnNo" type="button">No</button>
                    </div>
                    <label class="applicationFormLabel">What skills would you like to improve during this apprenticeship?</label>
                    <div style="padding-top: 15px; margin-bottom: 25px;">
                        <textarea placeholder="Type here:" class="applicationFormTextarea" required></textarea>
                    </div>
                    <label class="applicationFormLabel">What are your main strengths?</label>
                    <div style="padding-top: 15px; margin-bottom: 25px;">
                        <textarea placeholder="Type here:" class="applicationFormTextarea" required></textarea>
                    </div>
                    <label class="applicationFormLabel">What attracted you to this role?</label>
                    <div style="padding-top: 15px; margin-bottom: 25px;">
                        <textarea placeholder="Type here:" class="applicationFormTextarea" required></textarea>
                    </div>
                    <label class="applicationFormLabel">What skills, attributes, and experience do you have relevant to this role?</label>
                    <div style="padding-top: 15px; margin-bottom: 25px;">
                        <textarea placeholder="Type here:" class="applicationFormTextarea" required></textarea>
                    </div>
                    <label class="applicationFormLabel">What are your hobbies and interests?</label>
                    <div style="padding-top: 15px; margin-bottom: 25px;"    >
                        <textarea placeholder="Type here:" class="applicationFormTextarea" required></textarea>
                    </div>
                    <div style="display: flex; justify-content: center; align-items: center; margin-right: 10px;">
                        <button type="submit" class="submitBtn">Submit</button>
                    </div>
                </form>
            </div>
        </section>
        <footer class="footer">
            <div class="footerCopyright">
                <img class="logo" src="images/logo.png">
                <p class="footerCopyrightText">©Hot Beans Web, 2026, All rights reserved</p>
            </div>
            <div class="footerRow">
                <div class="footerContactPhone">
                    <h1 class="contactInfoHeading">Telephone: </h1>
                    <p class="contactInfoDescription">+44 07442641396</p>
                </div>
                <div class="footerContactEmail">
                    <h1 class="contactInfoHeading">Email: </h1>
                    <p class="contactInfoDescription">training@hotbeansweb.co.uk</p>
                </div>
                <div class="footerMenuColumn">
                    <nav class="footerNavigation">
                        <ul class="footerMenu">
                            <li class="footerMenuItem"><a class="footerMenuLink" href="aboutUs.html">About Us></a></li>
                            <li class="footerMenuItem"><a class="footerMenuLink" href="ourTeam.html">Our team></a></li>
                            <li class="footerMenuItem"><a class="footerMenuLink" href="vacancies.html">Vacancies></a></li>
                            <li class="footerMenuItem"><a class="footerMenuLink" href="training.html">Training></a></li> 
                            
                        </ul>
                    </nav>
                </div>
            </div>
        </footer>
    </body>
</html>
